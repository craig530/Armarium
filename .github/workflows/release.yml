name: Release

# Ad-hoc release process: tag a commit on main with vX.Y.Z and push the tag
# (e.g. `git tag v1.0.0 && git push origin v1.0.0`). This builds and
# publishes the backend/frontend images to GHCR and creates a GitHub Release
# with the matching CHANGELOG.md section as its body.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  images:
    name: Build & push ${{ matrix.component }} image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: |
            ghcr.io/craig530/armarium-${{ matrix.component }}:${{ github.ref_name }}
            ghcr.io/craig530/armarium-${{ matrix.component }}:latest
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  github-release:
    name: Create GitHub Release
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract CHANGELOG section for this version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]")) { found=1; next }
              next
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          cat release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            docker-compose.prod.yml
            .env.example
