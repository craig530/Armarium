name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint, SAST, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app

      - name: SAST (bandit)
        run: bandit -r app -ll

      - name: Dependency CVEs (pip-audit)
        run: pip-audit

      - name: Tests (pytest)
        run: python -m pytest -q

  backend-postgres:
    name: Backend (Alembic baseline on PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: armarium
          POSTGRES_USER: armarium
          POSTGRES_PASSWORD: armarium
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U armarium"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - run: pip install -r requirements.txt

      - name: Verify Alembic baseline against PostgreSQL
        run: python scripts/verify_postgres_baseline.py
        env:
          DATABASE_URL: postgresql+asyncpg://armarium:armarium@localhost:5432/armarium
          # `python scripts/...` puts scripts/ (not backend/) on sys.path, so
          # `from app...` imports would otherwise fail with ModuleNotFoundError.
          PYTHONPATH: .

  frontend:
    name: Frontend (build, tests, lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Tests (vitest)
        run: npm test -- --run

      - name: Lint (eslint)
        run: npm run lint

      - name: Dependency CVEs (npm audit)
        run: npm audit
