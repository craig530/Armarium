# Development overrides — hot reload for backend, Vite dev server for frontend.
#
# IMPORTANT: This file is intentionally named docker-compose.dev.yml (not override.yml)
# so it does NOT auto-load in production. Use explicitly:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Or set up the alias in your shell:
#   alias dcdev="docker compose -f docker-compose.yml -f docker-compose.dev.yml"

services:
  backend:
    environment:
      JWT_SECRET: dev-secret-not-for-production
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: devpassword
      TMDB_API_KEY: ""
      CORS_ORIGINS: "http://localhost:3000"
    volumes:
      - ./backend:/app          # mount source for hot reload
      - app_data:/app/data      # keep persistent data volume
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      target: builder           # stop at Node builder stage; skip nginx
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - /app/node_modules       # preserve container-built node_modules
    command: npm run dev -- --host 0.0.0.0 --port 3000
    depends_on:
      - backend
