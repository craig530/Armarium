<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Armarium</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#7B4A2E" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Armarium" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- SEO / description -->
    <meta name="description" content="Self-hosted media catalogue for CDs, DVDs, Blu-rays and Books" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Runs before the deferred module script below, so the .dark class
      // and PWA status-bar colour are correct from first paint — avoids a
      // light-mode flash on devices with a dark OS theme. Mirrors
      // applyThemeColor() in src/store/index.js.
      (function () {
        var pref = localStorage.getItem('armarium-theme-pref') || 'auto'
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        var dark = pref === 'dark' || (pref === 'auto' && prefersDark)
        if (dark) document.documentElement.classList.add('dark')
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', dark ? '#15100C' : '#FFFFFF')
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
