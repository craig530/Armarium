# Shared security headers — included from every location block in default.conf
# (nginx does not inherit add_header from the server block into a location
# that defines its own add_header, so this is included explicitly everywhere).

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Camera is required for barcode scanning; everything else sensitive is denied.
add_header Permissions-Policy "camera=(self), geolocation=(), microphone=(), payment=()" always;

# img-src allows http/https because cover art can be hotlinked from any
# user-supplied URL or third-party metadata source (TMDB, OpenLibrary, etc.).
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: http: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
